<!DOCTYPE html>
<html>
<head>
    <title>Mock Opt-Out Form</title>
</head>
<body>
    <h1>Simulação de Remoção de Dados - LGPD</h1>
    <form id="optout-form" method="POST" action="/mock-success">
        <label for="full_name">Nome Completo:</label>
        <input type="text" id="full_name" name="full_name" required><br><br>
        
        <label for="document">CPF:</label>
        <input type="text" id="document" name="document" required><br><br>
        
        <button type="submit" id="submit-btn">Solicitar Exclusão</button>
    </form>
    <div id="status-message" style="display:none; color: green; font-weight: bold;">
        Solicitação de opt-out enviada com sucesso!
    </div>
    
    <script>
        document.getElementById('optout-form').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('optout-form').style.display = 'none';
            document.getElementById('status-message').style.display = 'block';
        });
    </script>
</body>
</html>
