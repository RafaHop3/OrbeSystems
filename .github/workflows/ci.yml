name: CI — Orbe Systems

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Dummy value — build must succeed without real API URL
          NEXT_PUBLIC_API_URL: https://orbe-systems-api.onrender.com

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Syntax check all Python files
        run: |
          find . -name "*.py" -not -path "./.venv/*" | while read f; do
            python -m py_compile "$f" && echo "OK: $f" || exit 1
          done

      - name: Import check (entry point)
        run: python -c "import main; print('Entry point OK')"
        env:
          DATABASE_URL: sqlite:///./data/test.db
          SECRET_KEY: ci-test-secret-key-not-used-in-production
          ADMIN_USERNAME: ci_admin
          ADMIN_PASSWORD_HASH: $2b$12$placeholder_hash_for_ci_only
