name: Orbe Systems & INHO — Continuous Integration (CI)

on:
  push:
    branches: [ main, master, feat-* ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 🐍 1. Backend FastAPI & Ghost Engine CI
  # ==========================================
  backend-ci:
    name: Backend Pytest & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'inho_backend/requirements.txt'

      - name: Install Dependencies
        run: |
          cd inho_backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8 bandit

      - name: Run Code Quality Check (Flake8)
        run: |
          cd inho_backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Test Suite (E2E & Unit)
        run: |
          cd inho_backend
          python -m pytest -v tests/

      - name: Security Vulnerability Scan (Bandit)
        run: |
          cd inho_backend
          bandit -r core/ services/ routers/ -ll -ii || true

  # ==========================================
  # ⚡ 2. Frontend Next.js CI
  # ==========================================
  frontend-ci:
    name: Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type Checking
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Next.js ESLint Linting
        run: |
          cd frontend
          npm run lint || true

      - name: Test Production Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.orbesystems.com.br
