name: Orbe Systems & INHO — Continuous Integration (CI)

on:
  push:
    branches: [ main, master, feat-* ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 🐍 1. Backend FastAPI & Ghost Engine CI
  # ==========================================
  backend-ci:
    name: Backend Pytest & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'inho_backend/requirements.txt'

      # ⚡ Otimização de CI: Cache dos Binários do Playwright Chromium (~150MB)
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('inho_backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Dependencies
        run: |
          cd inho_backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8 bandit

      - name: Run Code Quality Check (Flake8)
        run: |
          cd inho_backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,__pycache__
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,venv,__pycache__

      - name: Run Pytest Test Suite (E2E & Unit)
        run: |
          cd inho_backend
          python -m pytest -v tests/ --ignore=tests/test_playwright_automator.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite+aiosqlite:///./test_inho.db' }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-testing-jwt-secret-key-32chars-min' }}
          SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-testing-jwt-secret-key-32chars-min' }}
          FERNET_KEYS: ${{ secrets.FERNET_KEYS || 't_ci_fernet_key_mock_32_bytes_base64_hash=' }}
          INHO_SYSTEM_SECRET: ${{ secrets.INHO_SYSTEM_SECRET || 'ci-inho-system-secret-token' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_mock_ci_testing_stripe_key_12345' }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_test_mock_webhook_secret' }}

      - name: Security Vulnerability Scan (Bandit)
        run: |
          cd inho_backend
          bandit -r core/ services/ routers/ -ll -ii || true

  # ==========================================
  # ⚡ 2. Frontend Next.js CI
  # ==========================================
  frontend-ci:
    name: Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'inho_frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd inho_frontend
          npm ci

      - name: TypeScript Type Checking
        run: |
          cd inho_frontend
          npx tsc --noEmit || true

      - name: Next.js ESLint Linting
        run: |
          cd inho_frontend
          npm run lint || true

      - name: Test Production Build
        run: |
          cd inho_frontend
          npm run build || true
        env:
          NEXT_PUBLIC_API_URL: https://api.orbesystems.com.br
