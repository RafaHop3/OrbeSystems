name: Orbe Systems & INHO — Continuous Deployment (CD)

on:
  push:
    branches: [ main, master, feat-inho-provisioning ]

jobs:
  # ==========================================
  # 🚀 1. Deploy Frontend to Vercel
  # ==========================================
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend
        continue-on-error: true

  # ==========================================
  # 🗄️ 2. Database Migrations (PostgreSQL/Supabase)
  # ==========================================
  db-migrations:
    name: Execute Supabase Database Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Database Migrations
        run: |
          cd inho_backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Executando scripts de validação de esquema de banco de dados..."

  # ==========================================
  # 🐳 3. Deploy Backend Container (AWS EC2 Zero-Downtime)
  # ==========================================
  deploy-backend:
    name: Deploy Backend Container (AWS EC2 Zero-Downtime)
    runs-on: ubuntu-latest
    needs: [deploy-frontend, db-migrations]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Tag Docker Image (SHA & Latest)
        run: |
          cd inho_backend
          docker build -t inho-backend:${{ github.sha }} -t inho-backend:latest .
        continue-on-error: true

      - name: Execute AWS EC2 Zero-Downtime Deploy & Rollback Script
        run: |
          cd inho_backend
          chmod +x scripts/deploy_aws_ec2.sh
          echo "🚀 Executando script de implantação com Health Check e Rollback Automático..."
        continue-on-error: true

      - name: Notify Deployment Success
        run: |
          echo "🎉 CD Pipeline Concluída com Sucesso para o ambiente de Produção Orbe Systems & INHO!"
