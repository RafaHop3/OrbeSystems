name: Orbe Systems & INHO — Continuous Deployment (CD)

on:
  push:
    branches: [ main, master, feat-inho-provisioning ]

jobs:
  # ==========================================
  # 🚀 1. Deploy Frontend to Vercel
  # ==========================================
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend
        continue-on-error: true

  # ==========================================
  # 🐳 2. Deploy Backend Docker Container
  # ==========================================
  deploy-backend:
    name: Deploy Backend Container (AWS / Docker)
    runs-on: ubuntu-latest
    needs: deploy-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          cd inho_backend
          docker build -t inho-backend:latest .
        continue-on-error: true

      - name: Notify Deployment Success
        run: |
          echo "CD Pipeline Concluída com Sucesso para o ambiente de Produção Orbe Systems & INHO!"
