name: Broker Demolition Engine (LGPD)

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: 'OrbeSystems DB Ticket ID'
        required: true
      target_broker:
        description: 'Alvo Data Broker (ex: Escavador, ConsultasFlex)'
        required: true

jobs:
  run-optout-robot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checando repositório local
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright httpx cryptography
          playwright install chromium
          
      - name: Run Playwright Worker
        env:
          FERNET_SECRET_KEY: ${{ secrets.FERNET_SECRET_KEY }}
          ORBESYSTEMS_DB_URL: ${{ secrets.POSTGRES_DIRECT_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          WEBHOOK_URL: 'https://api.orbesystems.com.br/api/optout/webhook'
          TICKET_ID: ${{ github.event.inputs.ticket_id }}
          TARGET_BROKER: ${{ github.event.inputs.target_broker }}
        run: |
          # The worker runs in a secure, ephemeral container. Data is immediately discarded when finished.
          python backend/scripts/optout_worker.py
