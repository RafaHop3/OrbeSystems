##############################################################################
# secrets-csi.yaml — Secrets Store CSI Driver + SecretProviderClass
#
# Pré-requisito: instalar o Helm chart do Secrets Store CSI Driver:
#   helm repo add secrets-store-csi-driver https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
#   helm install csi-secrets-store secrets-store-csi-driver/secrets-store-csi-driver \
#     --namespace kube-system \
#     --set syncSecret.enabled=true
#   helm repo add aws-secrets-manager https://aws.github.io/secrets-store-csi-driver-provider-aws
#   helm install aws-provider aws-secrets-manager/secrets-store-csi-driver-provider-aws \
#     --namespace kube-system
##############################################################################
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: orbe-api-secrets
  namespace: orbe-prod
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "orbe/stripe/api_key"
        objectType: "secretsmanager"
        objectAlias: "STRIPE_SECRET_KEY"
      - objectName: "orbe/stripe/webhook_secret"
        objectType: "secretsmanager"
        objectAlias: "STRIPE_WEBHOOK_SECRET"
      - objectName: "orbe/ai/api_key"
        objectType: "secretsmanager"
        objectAlias: "GEMINI_API_KEY"
      - objectName: "orbe/database/connection_string"
        objectType: "secretsmanager"
        objectAlias: "DATABASE_URL"
        jmesPath:
          - path: "url"
            objectAlias: "DATABASE_URL"
      - objectName: "orbe/redis/auth_token"
        objectType: "secretsmanager"
        objectAlias: "REDIS_AUTH_TOKEN"
  # Sincronizar como K8s Secret para uso como envFrom nos Pods
  secretObjects:
    - data:
        - key: STRIPE_SECRET_KEY
          objectName: STRIPE_SECRET_KEY
        - key: STRIPE_WEBHOOK_SECRET
          objectName: STRIPE_WEBHOOK_SECRET
        - key: GEMINI_API_KEY
          objectName: GEMINI_API_KEY
        - key: DATABASE_URL
          objectName: DATABASE_URL
        - key: REDIS_AUTH_TOKEN
          objectName: REDIS_AUTH_TOKEN
      secretName: orbe-api-secrets
      type: Opaque
