###############################################################################
# k8s/api-service.yaml — Orbe Systems Backend Service
# NodePort exposes the API on the Minikube node IP so Postman can reach it.
# Get URL: minikube service orbe-api-service --url
###############################################################################
apiVersion: v1
kind: Service
metadata:
  name: orbe-api-service
  labels:
    app: orbe-api
spec:
  type: NodePort
  selector:
    app: orbe-api
  ports:
    - protocol: TCP
      port: 80           # cluster-internal port
      targetPort: 8000   # matches containerPort in Deployment
      nodePort: 30080    # fixed external port: http://<minikube-ip>:30080
