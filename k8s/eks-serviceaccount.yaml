##############################################################################
# eks-serviceaccount.yaml — ServiceAccounts com IRSA annotations
##############################################################################

# ── ServiceAccount para Pods da API principal (Secrets Manager + KMS) ────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbe-api-sa
  namespace: orbe-prod
  annotations:
    # Role ARN gerado pelo Terraform (iam.tf → aws_iam_role.api_pod)
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/orbe-api-pod-role
    # Garante que o token de projeto não seja cacheado além de 1h
    eks.amazonaws.com/token-expiration: "3600"
  labels:
    app.kubernetes.io/name: orbe-api
    app.kubernetes.io/component: backend

---
# ── ServiceAccount para Pods de IA/Chat (DynamoDB) ───────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbe-ai-sa
  namespace: orbe-prod
  annotations:
    # Role ARN gerado pelo Terraform (iam.tf → aws_iam_role.ai_pod)
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/orbe-ai-pod-role
    eks.amazonaws.com/token-expiration: "3600"
  labels:
    app.kubernetes.io/name: orbe-chat
    app.kubernetes.io/component: ai

---
# ── NOTE: Substitua ACCOUNT_ID pelo ID real da conta AWS:
#    aws sts get-caller-identity --query Account --output text
##############################################################################
